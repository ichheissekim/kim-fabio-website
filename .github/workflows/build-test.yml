
name: Test website build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build website
        run: python build.py
      - name: Check generated website
        run: test -s index.html

      - name: Save website preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: |
            index.html
            impressum.html
            datenschutz.html
            style.css
            experimental.css
            site.js
            media/
